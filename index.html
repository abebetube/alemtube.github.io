<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AlemTube - נגן יוטיוב</title>
    
    <!-- קישור לקובץ CSS חיצוני -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- קישור לקובץ JavaScript חיצוני (בסוף body) -->
    <script src="js/alemtube.js" defer></script> 
    
    <!-- קישור לתמונה -->
    <link rel="icon" type="image/x-icon" href="images/logo.png">
</head>
<body>
  <header>AbeTube - נגן יוטיוב  </header>

  <div class="container">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="הקלד מילת חיפוש או קישור ל-YouTube" />
      <button onclick="searchVideos()">חפש</button>
    </div>

    <div id="player-container"></div>
    <div id="results"></div>
  </div>

  <button id="fullscreen-btn" onclick="toggleFullScreen()">מעבר למסך מלא</button>

  <div id="splash">
  <div class="fireworks"></div>
  <div class="logo-area">
    <img src="logo.png" alt="logo" />
    <h1 class="title">AbeTube</h1>
  </div>
</div>
  
  
  
    <script src="js/alemtube.js"></script>
</body>
</html>
