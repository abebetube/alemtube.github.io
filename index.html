<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Alem Tube</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="logo.png" />
  
  <!-- קישור לקובץ CSS חיצוני -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- קישור ל-YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <!-- מסך התחלה עם זיקוקים -->
  <div id="splash">
    <div class="fireworks"></div>
    <div class="logo-area">
      <img src="logo.png" alt="AbeTube Logo" />
      <h1 class="title">AbeTube</h1>
    </div>
  </div>

  <!-- תוכן האתר -->
  <header>AlemTube - vidoe player</header>

  <div class="container">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="הקלד מילת חיפוש או קישור ל-YouTube" />
      <button id="searchBtn">חפש</button>
    </div>

    <div id="player-container"></div>
    <div id="results"></div>
  </div>

 
  <!-- קישור לקובץ JavaScript חיצוני -->
   <script src="js/alemtube.js"></script>
</body>
</html>
